# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# The name of this file must be .pre-commit-config.yaml
# Run pre-commit: pre-commit run --all-files
# Run mypy: uv run mypy
# Run ruff: uv run ruff check .
fail_fast: false
exclude: |
  (?x)^(
    .*\.drawio|
    .*\.qss|
    .*\.qrc|
    .*\.svg|
    packages/chemunited-orchestrator/src/chemunited/shared/resources/resources_rc\.py
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      # black, ruff, and mypy all run via `uv run` against the real workspace
      # venv rather than pre-commit's own isolated, separately-versioned
      # hook environments. Two concrete reasons this matters, not just
      # tidiness: (1) mypy needs to resolve the five local packages' own
      # types — an isolated env only knows what's pinned in
      # additional_dependencies, meaning re-pinning published PyPI versions
      # of our own packages on every change instead of checking against the
      # workspace's local, editable code; (2) black/ruff previously had
      # isolated-hook pins (25.1.0 / v0.11.2) that drifted out of sync with
      # whatever the workspace's open-ended `black>=25.1.0`/`ruff>=0.15.7`
      # constraints actually resolved to (26.5.1 / 0.16.4 at time of writing)
      # — two differently-versioned formatters with different opinions on
      # the same file caused an infinite reformat-disagree loop.
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]

      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
