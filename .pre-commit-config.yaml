# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# The name of this file must be .pre-commit-config.yaml
# Run pre-commit: pre-commit run --all-files
# Run mypy: uv run mypy
# Run ruff: uv run ruff check .
fail_fast: false
exclude: |
  (?x)^(
    .*\.drawio|
    .*\.qss|
    .*\.qrc|
    .*\.svg|
    packages/chemunited-orchestrator/src/chemunited/shared/resources/resources_rc\.py
  )$

repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        exclude: '.*\.svg$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      # Lint + auto-fix
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      # Runs against the real uv workspace venv (via `uv run`) rather than an
      # isolated pre-commit-managed env, since mypy needs to resolve the five
      # local packages' own types — an isolated env only knows about whatever
      # is pinned in additional_dependencies, which would mean re-pinning
      # published PyPI versions of our own packages on every change instead
      # of checking against the workspace's local, editable code.
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
