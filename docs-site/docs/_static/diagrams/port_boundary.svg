<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="Trebuchet MS, Verdana, Arial, sans-serif">
  <title>Port.boundary values</title>
  <defs>
    <marker id="arrow-pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <line x1="180" y1="150" x2="278" y2="63" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-pb)"/>
  <line x1="180" y1="150" x2="278" y2="150" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-pb)"/>
  <line x1="180" y1="150" x2="278" y2="238" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-pb)"/>

  <rect x="20" y="130" width="160" height="40" rx="6" ry="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="100" y="155" text-anchor="middle" font-size="14" fill="#333333">Port.boundary</text>

  <rect x="280" y="20" width="320" height="80" rx="6" ry="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="440" y="42" text-anchor="middle" font-size="13" fill="#333333">None</text>
  <text x="440" y="60" text-anchor="middle" font-size="11" fill="#333333">ordinary internal port &#8212;</text>
  <text x="440" y="76" text-anchor="middle" font-size="11" fill="#333333">pressure &amp; flow both solved by the network</text>

  <rect x="280" y="120" width="320" height="60" rx="6" ry="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="440" y="145" text-anchor="middle" font-size="13" fill="#333333">PRESSURE, value</text>
  <text x="440" y="163" text-anchor="middle" font-size="11" fill="#333333">fixed pressure (Pa) &#8212; e.g. a Pressure Control</text>

  <rect x="280" y="200" width="320" height="80" rx="6" ry="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="440" y="222" text-anchor="middle" font-size="13" fill="#333333">FLOW, value</text>
  <text x="440" y="240" text-anchor="middle" font-size="11" fill="#333333">fixed flow (m&#179;/s) &#8212; e.g. a Flow Source</text>
  <text x="440" y="256" text-anchor="middle" font-size="11" fill="#333333">(0 acts as a closed dead-end)</text>
</svg>
