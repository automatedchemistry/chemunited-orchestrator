<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" font-family="Trebuchet MS, Verdana, Arial, sans-serif">
  <title>Junction with hidden hub</title>
  <defs>
    <marker id="arrow-jhh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <line x1="140" y1="40" x2="282" y2="97" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-jhh)"/>
  <line x1="140" y1="120" x2="279" y2="120" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-jhh)"/>
  <line x1="140" y1="200" x2="282" y2="143" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-jhh)"/>

  <rect x="20" y="20" width="120" height="40" rx="6" ry="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="80" y="45" text-anchor="middle" font-size="14" fill="#333333">Port 1</text>

  <rect x="20" y="100" width="120" height="40" rx="6" ry="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="80" y="125" text-anchor="middle" font-size="14" fill="#333333">Port 2</text>

  <rect x="20" y="180" width="120" height="40" rx="6" ry="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="80" y="205" text-anchor="middle" font-size="14" fill="#333333">Port 3</text>

  <ellipse cx="340" cy="120" rx="60" ry="60" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="340" y="115" text-anchor="middle" font-size="13" fill="#333333">hidden hub</text>
  <text x="340" y="132" text-anchor="middle" font-size="13" fill="#333333">Port 0</text>
</svg>
