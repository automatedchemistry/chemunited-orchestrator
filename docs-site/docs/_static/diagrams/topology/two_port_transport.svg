<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" font-family="Trebuchet MS, Verdana, Arial, sans-serif">
  <title>Two-port inline transport</title>
  <defs>
    <marker id="arrow-tpt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>

  <line x1="140" y1="60" x2="279" y2="60" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow-tpt)"/>

  <rect x="150" y="42" width="120" height="36" fill="#ffffff"/>
  <text x="210" y="56" text-anchor="middle" font-size="12" fill="#333333">TRANSPORT edge</text>
  <text x="210" y="70" text-anchor="middle" font-size="12" fill="#333333">length, diameter</text>

  <rect x="20" y="40" width="120" height="40" rx="6" ry="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="80" y="65" text-anchor="middle" font-size="14" fill="#333333">Port 1</text>

  <rect x="280" y="40" width="120" height="40" rx="6" ry="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="340" y="65" text-anchor="middle" font-size="14" fill="#333333">Port 2</text>
</svg>
