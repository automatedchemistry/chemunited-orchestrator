name: Security Analysis

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  package-security:
    name: Dependency and static security scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Sync workspace
        run: uv sync --all-extras

      - name: Install security tools
        run: uv pip install pip-audit "bandit[toml]"

      - name: Audit Python dependencies
        run: |
          uv run pip-audit \
            --skip-editable \
            --ignore-vuln PYSEC-2025-183  # false positive — not reachable via chemunited's usage

      - name: Run Bandit
        # Each package that declares its own [tool.bandit] skips (orchestrator,
        # sim) picks that up automatically since bandit reads pyproject.toml
        # from the directory being scanned; the rest fall back to defaults.
        run: |
          uv run bandit -c packages/chemunited-quantities/pyproject.toml -r packages/chemunited-quantities/src
          uv run bandit -c packages/chemunited-core/pyproject.toml -r packages/chemunited-core/src
          uv run bandit -c packages/chemunited-workflow/pyproject.toml -r packages/chemunited-workflow/chemunited_workflow
          uv run bandit -c packages/chemunited-sim/pyproject.toml -r packages/chemunited-sim/src
          uv run bandit -c packages/chemunited-orchestrator/pyproject.toml -r packages/chemunited-orchestrator/src/chemunited
