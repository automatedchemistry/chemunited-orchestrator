repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix --no-cache
        language: system
        types: [python]
      - id: black
        name: black
        entry: black --no-cache
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
