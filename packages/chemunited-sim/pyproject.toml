[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chemunited-sim"
version = "0.0.3"
description = "Dynamic simulation engine for fluidic automation platforms built on chemunited-core."
license = { file = "LICENSE" }
authors = [
    { name = "Samuel Vitor Saraiva" },
]
requires-python = ">=3.11"
dependencies = [
    "chemunited-core>=0.0.7",
    "chemunited-workflow>=0.0.8",
    "scipy>=1.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "pyvis>=0.3.2",
    "mcp[cli]>=1.23",
]

[project.scripts]
chemunited-sim = "chemunited_sim.cli.main:main"

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "mypy>=1.19.1",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.7",
]
tray = [
    "pystray>=0.19",
    "pillow>=10",
]

[tool.uv.sources]
chemunited-core = { workspace = true }
chemunited-workflow = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/chemunited_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/chemunited_sim"]

[tool.bandit]
# B101 (assert_used): style nit, not a vulnerability check — we use asserts as
# internal invariants after a preceding guard already rules out the failing case.
skips = ["B101"]
