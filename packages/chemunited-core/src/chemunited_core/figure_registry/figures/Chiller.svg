<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: Chiller (recirculating thermostat).
     Units: scene px at 100 % zoom. Heat connection / port at (58.3, 50). -->
<svg xmlns="http://www.w3.org/2000/svg" width="2.08333in" height="3.12499in" viewBox="0 0 66.667 100">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#2B3746"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <g fill="#475569">
    <rect x="6" y="95" width="11" height="4.5" rx="1"/>
    <rect x="49.667" y="95" width="11" height="4.5" rx="1"/>
  </g>
  <rect x="1.5" y="1.5" width="63.667" height="94.5" rx="4" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>

  <!-- control panel -->
  <rect x="6" y="6" width="54.667" height="25" rx="2.5" fill="url(#panel)" stroke="#1E293B" stroke-width="0.8"/>
  <rect x="10" y="10" width="28" height="11" rx="1.5" fill="#0F172A" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="13" y1="15.5" x2="30" y2="15.5" stroke="#7DD3FC" stroke-width="2.4" stroke-linecap="round"/>
  <g stroke="#7DD3FC" stroke-width="1.1" stroke-linecap="round">
    <line x1="49.3" y1="11.5" x2="49.3" y2="20.5"/>
    <line x1="45.4" y1="13.75" x2="53.2" y2="18.25"/>
    <line x1="45.4" y1="18.25" x2="53.2" y2="13.75"/>
  </g>
  <g fill="#94A3B8">
    <rect x="10" y="24" width="7" height="3.5" rx="0.8"/>
    <rect x="19.5" y="24" width="7" height="3.5" rx="0.8"/>
    <rect x="29" y="24" width="7" height="3.5" rx="0.8"/>
  </g>
  <rect x="2.1" y="35" width="62.467" height="3" fill="#38BDF8"/>

  <!-- grille -->
  <g stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round">
    <line x1="9" y1="48" x2="44" y2="48"/>
    <line x1="9" y1="54" x2="44" y2="54"/>
    <line x1="9" y1="60" x2="44" y2="60"/>
    <line x1="9" y1="66" x2="44" y2="66"/>
    <line x1="9" y1="72" x2="44" y2="72"/>
    <line x1="9" y1="78" x2="44" y2="78"/>
    <line x1="9" y1="84" x2="44" y2="84"/>
  </g>

  <!-- circulation connector -->
  <rect x="50.5" y="41" width="12.5" height="18" rx="2" fill="url(#metal)" stroke="#334155" stroke-width="1"/>
  <circle cx="58.3" cy="50" r="3.6" fill="#E2E8F0" stroke="#334155" stroke-width="0.8"/>
  <g stroke-width="1.2" stroke-linecap="round">
    <line x1="53" y1="44" x2="56" y2="44" stroke="#38BDF8"/>
    <line x1="53" y1="56" x2="56" y2="56" stroke="#F97316"/>
  </g>
</svg>
