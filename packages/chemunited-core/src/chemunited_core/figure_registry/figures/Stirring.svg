<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: Stirring (hot-plate magnetic stirrer).
     Units: scene px at 100 % zoom. -->
<svg xmlns="http://www.w3.org/2000/svg" width="4.6875in" height="1.66666in" viewBox="0 0 100 35.555">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#A3B0BE"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect x="14" y="1" width="72" height="7.5" rx="2.5" fill="url(#plate)" stroke="#334155" stroke-width="1.2"/>
  <line x1="18" y1="2.8" x2="82" y2="2.8" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="0.8" stroke-linecap="round"/>
  <rect x="22" y="8" width="56" height="3.5" fill="#94A3B8" stroke="#334155" stroke-width="0.8"/>
  <rect x="2" y="10.5" width="96" height="24.4" rx="4" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>

  <!-- display -->
  <rect x="30" y="15.5" width="40" height="14" rx="2" fill="#0F172A" stroke="#334155" stroke-width="0.6"/>
  <g stroke-width="2.4" stroke-linecap="round">
    <line x1="34" y1="22.5" x2="46" y2="22.5" stroke="#FB923C"/>
    <line x1="54" y1="22.5" x2="66" y2="22.5" stroke="#5EEAD4"/>
  </g>

  <!-- heat + stir knobs -->
  <circle cx="16" cy="22.7" r="7" fill="url(#panel)" stroke="#F97316" stroke-width="1.6"/>
  <circle cx="84" cy="22.7" r="7" fill="url(#panel)" stroke="#2F6FB2" stroke-width="1.6"/>
  <g stroke="#E2E8F0" stroke-width="1.1" stroke-linecap="round">
    <line x1="16" y1="18" x2="16" y2="21.5"/>
    <line x1="84" y1="18" x2="84" y2="21.5"/>
  </g>
</svg>
