<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: PhotoLeds (LED bar of the photoreactor).
     Units: scene px at 100 % zoom. Sits on top of the reactor plate. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1.45833in" height="0.468748in" viewBox="0 0 50 16.071">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="beamV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="beamB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- light cones -->
  <polygon points="9.5,8 15.5,8 21.5,16 3.5,16" fill="url(#beamV)"/>
  <polygon points="22,8 28,8 34,16 16,16" fill="url(#beamB)"/>
  <polygon points="34.5,8 40.5,8 46.5,16 28.5,16" fill="url(#beamG)"/>

  <!-- LED emitters -->
  <g stroke="#1E293B" stroke-width="0.5">
    <path d="M9.6 6 H15.4 V7.5 A2.9 2.9 0 0 1 9.6 7.5 Z" fill="#A78BFA"/>
    <path d="M22.1 6 H27.9 V7.5 A2.9 2.9 0 0 1 22.1 7.5 Z" fill="#60A5FA"/>
    <path d="M34.6 6 H40.4 V7.5 A2.9 2.9 0 0 1 34.6 7.5 Z" fill="#4ADE80"/>
  </g>

  <!-- bar housing -->
  <rect x="0.5" y="0.5" width="49" height="6" rx="2" fill="url(#panel)" stroke="#1E293B" stroke-width="0.7"/>
  <line x1="2.5" y1="1.8" x2="47.5" y2="1.8" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.6" stroke-linecap="round"/>
</svg>
