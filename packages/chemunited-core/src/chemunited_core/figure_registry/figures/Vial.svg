<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: Vial (screw-cap sample vial).
     Units: scene px for a single 100 px vial; in tray arrays it is shown at
     30 px, so line weights are slightly heavier than usual. Translucent glass:
     the liquid is painted underneath (x 8.7-51.3, y 27-94). -->
<svg xmlns="http://www.w3.org/2000/svg" width="2.8125in" height="4.6875in" viewBox="0 0 60 100">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#E0F2FE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#BAE6FD" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B9BE0"/>
      <stop offset="1" stop-color="#1F4F91"/>
    </linearGradient>
  </defs>

  <!-- glass -->
  <rect x="9" y="19" width="42" height="8" fill="url(#glass)" stroke="#64748B" stroke-width="1.8"/>
  <rect x="6.5" y="25.5" width="47" height="73" rx="6" fill="url(#glass)" stroke="#64748B" stroke-width="1.8"/>
  <rect x="11.5" y="32" width="4" height="58" rx="2" fill="#FFFFFF" fill-opacity="0.6"/>

  <!-- screw cap with septum -->
  <rect x="4" y="5" width="52" height="17" rx="3" fill="url(#cap)" stroke="#1E3A5F" stroke-width="1.8"/>
  <rect x="14" y="1" width="32" height="5" rx="1.5" fill="#CBD5E1" stroke="#1E3A5F" stroke-width="1.5"/>
  <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.6">
    <line x1="12" y1="9" x2="12" y2="19"/>
    <line x1="20" y1="9" x2="20" y2="19"/>
    <line x1="28" y1="9" x2="28" y2="19"/>
    <line x1="36" y1="9" x2="36" y2="19"/>
    <line x1="44" y1="9" x2="44" y2="19"/>
    <line x1="52" y1="9" x2="52" y2="19"/>
  </g>
</svg>
