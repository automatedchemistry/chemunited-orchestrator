<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: MSControl (benchtop mass spectrometer).
     Units: scene px at 100 % zoom. Inlet fittings / ports at (10, 8.57)
     and (25, 8.57) on the ion-source module. -->
<svg xmlns="http://www.w3.org/2000/svg" width="3.64583in" height="3.54166in" viewBox="0 0 100 97.143">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#A3B0BE"/>
    </linearGradient>
    <radialGradient id="source" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0F172A"/>
    </radialGradient>
    <radialGradient id="nut" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </radialGradient>
  </defs>

  <g fill="#475569">
    <rect x="8" y="91" width="12" height="5" rx="1"/>
    <rect x="80" y="91" width="12" height="5" rx="1"/>
  </g>
  <rect x="2" y="14" width="96" height="78" rx="5" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>
  <rect x="2.6" y="48" width="94.8" height="3" fill="#10B981"/>

  <!-- display with stick spectrum -->
  <rect x="42" y="20" width="50" height="22" rx="2" fill="#0F172A" stroke="#334155" stroke-width="0.6"/>
  <line x1="46" y1="38" x2="88" y2="38" stroke="#5EEAD4" stroke-opacity="0.5" stroke-width="0.6"/>
  <g stroke="#5EEAD4" stroke-width="1.4">
    <line x1="50" y1="38" x2="50" y2="33"/>
    <line x1="55" y1="38" x2="55" y2="30"/>
    <line x1="61" y1="38" x2="61" y2="24"/>
    <line x1="66" y1="38" x2="66" y2="34"/>
    <line x1="72" y1="38" x2="72" y2="28"/>
    <line x1="78" y1="38" x2="78" y2="35"/>
    <line x1="84" y1="38" x2="84" y2="31"/>
  </g>

  <!-- vacuum section -->
  <g stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round">
    <line x1="10" y1="60" x2="90" y2="60"/>
    <line x1="10" y1="66" x2="90" y2="66"/>
    <line x1="10" y1="72" x2="90" y2="72"/>
    <line x1="10" y1="78" x2="90" y2="78"/>
    <line x1="10" y1="84" x2="90" y2="84"/>
  </g>

  <!-- ion source module -->
  <rect x="3" y="2.5" width="32" height="41" rx="3" fill="url(#slate)" stroke="#334155" stroke-width="1.2"/>
  <circle cx="19" cy="29" r="7.5" fill="url(#source)" stroke="#1E293B" stroke-width="0.8"/>
  <path d="M14.5 25.5 A5.5 5.5 0 0 1 18 23" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1" stroke-linecap="round"/>
  <g fill="url(#nut)" stroke="#334155" stroke-width="0.9">
    <circle cx="10" cy="8.57" r="4.2"/>
    <circle cx="25" cy="8.57" r="4.2"/>
  </g>
</svg>
