<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: SyringeBarrel (syringe pump with mounted syringe).
     Units: scene px at 100 % zoom. Translucent barrel: the liquid
     (x 22.5-72.5, y 27.4-37.4) and the plunger layer are painted underneath.
     Luer tip / port at (0, 32.65). -->
<svg xmlns="http://www.w3.org/2000/svg" width="5.41666in" height="2.29166in" viewBox="0 0 100 42.308">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#E0F2FE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#BAE6FD" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- pump housing -->
  <rect x="8" y="0.8" width="91" height="19.4" rx="3" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>
  <rect x="8.6" y="15.6" width="89.8" height="3.4" fill="#2F6FB2"/>
  <rect x="58" y="4" width="34" height="9.5" rx="1.5" fill="#0F172A" stroke="#334155" stroke-width="0.6"/>
  <g stroke="#5EEAD4" stroke-width="1.2" stroke-linecap="round">
    <line x1="61" y1="7.2" x2="75" y2="7.2"/>
    <line x1="61" y1="10.4" x2="70" y2="10.4"/>
  </g>
  <circle cx="88" cy="8.75" r="1.3" fill="#22C55E"/>
  <g fill="url(#slate)" stroke="#475569" stroke-width="0.6">
    <rect x="14" y="6.2" width="6" height="5" rx="1"/>
    <rect x="22.5" y="6.2" width="6" height="5" rx="1"/>
    <rect x="31" y="6.2" width="6" height="5" rx="1"/>
  </g>

  <!-- syringe cradle -->
  <rect x="17" y="20.2" width="66" height="4.2" fill="url(#slate)" stroke="#334155" stroke-width="0.8"/>

  <!-- luer tip + hub -->
  <rect x="0.8" y="31.4" width="14" height="2.5" rx="0.6" fill="url(#metal)" stroke="#475569" stroke-width="0.5"/>
  <polygon points="21.4,28.4 14.2,30.6 14.2,34.7 21.4,36.9" fill="#E2E8F0" stroke="#64748B" stroke-width="0.7" stroke-linejoin="round"/>

  <!-- glass barrel -->
  <rect x="21.4" y="25.8" width="54.2" height="13.7" rx="1.6" fill="url(#glass)" stroke="#64748B" stroke-width="1"/>
  <line x1="23.5" y1="28.2" x2="73.5" y2="28.2" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round"/>
  <g stroke="#64748B" stroke-width="0.5">
    <line x1="27.5" y1="25.8" x2="27.5" y2="28"/>
    <line x1="32.5" y1="25.8" x2="32.5" y2="27"/>
    <line x1="37.5" y1="25.8" x2="37.5" y2="28"/>
    <line x1="42.5" y1="25.8" x2="42.5" y2="27"/>
    <line x1="47.5" y1="25.8" x2="47.5" y2="28"/>
    <line x1="52.5" y1="25.8" x2="52.5" y2="27"/>
    <line x1="57.5" y1="25.8" x2="57.5" y2="28"/>
    <line x1="62.5" y1="25.8" x2="62.5" y2="27"/>
    <line x1="67.5" y1="25.8" x2="67.5" y2="28"/>
  </g>
  <!-- finger flange + holder -->
  <rect x="75.2" y="22.6" width="2.6" height="19.2" rx="0.8" fill="#E2E8F0" stroke="#64748B" stroke-width="0.6"/>
  <rect x="78.2" y="22" width="4" height="19.8" rx="0.8" fill="url(#slate)" stroke="#334155" stroke-width="0.8"/>
</svg>
