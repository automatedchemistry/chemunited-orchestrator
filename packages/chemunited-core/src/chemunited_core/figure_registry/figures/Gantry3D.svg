  <g fill="#FFFFFF" fill-opacity="0.45" stroke="#64748B" stroke-width="0.6">
    <rect x="28.92" y="112.80" width="7" height="12" rx="1.2"/>
    <rect x="42.70" y="112.80" width="7" height="12" rx="1.2"/>
    <rect x="56.47" y="112.80" width="7" height="12" rx="1.2"/>
