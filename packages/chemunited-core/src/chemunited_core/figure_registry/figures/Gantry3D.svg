<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: Gantry3D (XYZ cartesian liquid handler over a vial deck,
     drawn in oblique projection: depth runs up and to the right).
     Units: scene px at 100 % zoom (200 px wide). Head fitting / port at
     (100, 15.5), same as Gantry.svg. The top-left corner (x < 34, y < 25) is
     left empty for the "3D" label drawn in code. Axis colours: x red,
     y green, z blue. -->
<svg xmlns="http://www.w3.org/2000/svg" width="5.35433in" height="3.64173in" viewBox="0 0 200 136.029">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94A3B8"/>
      <stop offset="0.45" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="carriage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B9BE0"/>
      <stop offset="1" stop-color="#1F4F91"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="nut" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </radialGradient>
  </defs>

  <!-- deck (top, front and right faces) -->
  <g stroke="#334155" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="6,130 168,130 192,104 30,104" fill="url(#deck)"/>
    <polygon points="6,130 168,130 168,135 6,135" fill="#94A3B8"/>
    <polygon points="168,130 192,104 192,109 168,135" fill="#A3B0BE"/>
  </g>

  <!-- back posts -->
  <g fill="url(#metalV)" stroke="#334155" stroke-width="1">
    <rect x="30" y="28" width="6" height="76"/>
    <rect x="186" y="28" width="6" height="76"/>
  </g>

  <!-- vials: back row (A) -->
  <g fill="#FFFFFF" fill-opacity="0.45" stroke="#64748B" stroke-width="0.6">
