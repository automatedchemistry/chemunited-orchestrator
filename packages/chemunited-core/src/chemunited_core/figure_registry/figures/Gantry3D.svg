  <g stroke-width="1.4" stroke-linecap="round">
    <line x1="168" y1="19" x2="184" y2="19" stroke="#EF4444"/>
    <line x1="168" y1="19" x2="173.76" y2="12.75" stroke="#22C55E"/>
