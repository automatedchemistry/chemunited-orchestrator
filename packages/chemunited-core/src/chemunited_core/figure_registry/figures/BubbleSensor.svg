<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: BubbleSensor (optical clip-on sensor around a tube).
     Units: scene px at 100 % zoom. Tube ends / ports at (2, 23.84) and
     (98, 23.84). -->
<svg xmlns="http://www.w3.org/2000/svg" width="0.989583in" height="0.333331in" viewBox="0 0 100 33.684">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#CBD5E1" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- tube with bubbles -->
  <rect x="1" y="21.3" width="98" height="5.1" rx="2.5" fill="url(#tube)" stroke="#64748B" stroke-width="0.8"/>
  <g fill="#FFFFFF" stroke="#64748B" stroke-width="0.5">
    <circle cx="12" cy="23.84" r="1.6"/>
    <circle cx="18.5" cy="23.84" r="1"/>
    <circle cx="82" cy="23.84" r="1.8"/>
    <circle cx="89" cy="23.84" r="1.1"/>
  </g>

  <!-- sensor clip -->
  <rect x="46.5" y="0.6" width="7" height="4.5" fill="#94A3B8" stroke="#334155" stroke-width="0.7"/>
  <rect x="28" y="4" width="44" height="28.5" rx="3.5" fill="url(#panel)" stroke="#1E293B" stroke-width="1"/>
  <line x1="31" y1="5.6" x2="69" y2="5.6" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.8" stroke-linecap="round"/>
  <rect x="28.6" y="19.6" width="42.8" height="8.5" fill="#1E293B"/>
  <rect x="28.6" y="21.6" width="42.8" height="4.5" fill="#94A3B8" fill-opacity="0.45"/>
  <g stroke="#1E293B" stroke-width="0.6">
    <circle cx="40" cy="12" r="2.8" fill="#EF4444"/>
    <circle cx="60" cy="12" r="2.8" fill="#22C55E"/>
  </g>
</svg>
