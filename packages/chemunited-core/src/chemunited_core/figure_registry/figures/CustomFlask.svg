<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: CustomFlask (cylindrical vessel with lid and base).
     Units: scene px at 100 % zoom. Translucent glass: the liquid level is
     painted underneath (full width, full height). Lid and base are opaque.
     Bottom outlet at (24.2, 100); dip tube enters through the lid at x 24.2. -->
<svg xmlns="http://www.w3.org/2000/svg" width="2.08333in" height="3.51041in" viewBox="0 0 59.347 100">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="0.35" stop-color="#E0F2FE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#BAE6FD" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- glass cylinder -->
  <rect x="0.6" y="6" width="58.147" height="88" fill="url(#glass)" stroke="#64748B" stroke-width="1.2"/>
  <rect x="4.6" y="13" width="2.6" height="74" rx="1.3" fill="#FFFFFF" fill-opacity="0.55"/>
  <g stroke="#64748B" stroke-width="0.7" stroke-linecap="round">
    <line x1="44" y1="20" x2="53" y2="20"/>
    <line x1="48.5" y1="27.5" x2="53" y2="27.5"/>
    <line x1="44" y1="35" x2="53" y2="35"/>
    <line x1="48.5" y1="42.5" x2="53" y2="42.5"/>
    <line x1="44" y1="50" x2="53" y2="50"/>
    <line x1="48.5" y1="57.5" x2="53" y2="57.5"/>
    <line x1="44" y1="65" x2="53" y2="65"/>
    <line x1="48.5" y1="72.5" x2="53" y2="72.5"/>
    <line x1="44" y1="80" x2="53" y2="80"/>
  </g>

  <!-- lid -->
  <rect x="0.6" y="0.6" width="58.147" height="8" rx="2" fill="url(#metal)" stroke="#334155" stroke-width="1.2"/>
  <g fill="#94A3B8" stroke="#475569" stroke-width="0.5">
    <circle cx="6" cy="4.6" r="1.5"/>
    <circle cx="53.35" cy="4.6" r="1.5"/>
  </g>

  <!-- base -->
  <rect x="0.6" y="91.4" width="58.147" height="8" rx="2" fill="url(#metal)" stroke="#334155" stroke-width="1.2"/>
  <g fill="#94A3B8" stroke="#475569" stroke-width="0.5">
    <circle cx="6" cy="95.4" r="1.5"/>
    <circle cx="53.35" cy="95.4" r="1.5"/>
  </g>
</svg>
