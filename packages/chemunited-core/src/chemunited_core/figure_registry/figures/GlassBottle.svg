<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: GlassBottle (wide-mouth media bottle).
     Units: scene px at 100 % zoom. The glass is translucent because the
     liquid level is painted underneath it (x 2.6-57.6, full height). -->
<svg xmlns="http://www.w3.org/2000/svg" width="2.32291in" height="3.85417in" viewBox="0 0 60.27 100">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="0.35" stop-color="#E0F2FE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#BAE6FD" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B9BE0"/>
      <stop offset="1" stop-color="#1F4F91"/>
    </linearGradient>
  </defs>

  <!-- glass body -->
  <rect x="2.6" y="8" width="55.07" height="91.4" rx="10" fill="url(#glass)" stroke="#64748B" stroke-width="1.2"/>
  <rect x="6.6" y="20" width="2.6" height="68" rx="1.3" fill="#FFFFFF" fill-opacity="0.55"/>

  <!-- graduation -->
  <g stroke="#64748B" stroke-width="0.7" stroke-linecap="round">
    <line x1="45" y1="30" x2="53" y2="30"/>
    <line x1="49" y1="37.5" x2="53" y2="37.5"/>
    <line x1="45" y1="45" x2="53" y2="45"/>
    <line x1="49" y1="52.5" x2="53" y2="52.5"/>
    <line x1="45" y1="60" x2="53" y2="60"/>
    <line x1="49" y1="67.5" x2="53" y2="67.5"/>
    <line x1="45" y1="75" x2="53" y2="75"/>
    <line x1="49" y1="82.5" x2="53" y2="82.5"/>
  </g>

  <!-- screw cap + pouring ring (opaque: hides the liquid's rounded top) -->
  <rect x="4.6" y="12" width="51.07" height="5" rx="1.5" fill="#5B9BE0" stroke="#1E3A5F" stroke-width="1"/>
  <rect x="1" y="0.8" width="58.27" height="12.6" rx="2.5" fill="url(#cap)" stroke="#1E3A5F" stroke-width="1.2"/>
  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="0.9">
    <line x1="6" y1="3.5" x2="6" y2="11"/>
    <line x1="10" y1="3.5" x2="10" y2="11"/>
    <line x1="14" y1="3.5" x2="14" y2="11"/>
    <line x1="18" y1="3.5" x2="18" y2="11"/>
    <line x1="22" y1="3.5" x2="22" y2="11"/>
    <line x1="26" y1="3.5" x2="26" y2="11"/>
    <line x1="30.1" y1="3.5" x2="30.1" y2="11"/>
    <line x1="34.2" y1="3.5" x2="34.2" y2="11"/>
    <line x1="38.2" y1="3.5" x2="38.2" y2="11"/>
    <line x1="42.2" y1="3.5" x2="42.2" y2="11"/>
    <line x1="46.2" y1="3.5" x2="46.2" y2="11"/>
    <line x1="50.2" y1="3.5" x2="50.2" y2="11"/>
    <line x1="54.2" y1="3.5" x2="54.2" y2="11"/>
  </g>
  <line x1="3.5" y1="2.4" x2="56.7" y2="2.4" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.9" stroke-linecap="round"/>
</svg>
