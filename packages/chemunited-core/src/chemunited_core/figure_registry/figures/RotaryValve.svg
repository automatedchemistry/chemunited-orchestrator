<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: RotaryValve (drive housing + valve head).
     Units: scene px at 100 % zoom (200 px wide). Head centre at (100, 92.3);
     ports sit on r = 50 and the rotor channels (r <= 36) are drawn in code. -->
<svg xmlns="http://www.w3.org/2000/svg" width="6.77083in" height="6.24999in" viewBox="0 0 200 184.615">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4B5A6C"/>
      <stop offset="1" stop-color="#26313E"/>
    </linearGradient>
    <radialGradient id="bezel" cx="0.4" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8794A3"/>
    </radialGradient>
    <radialGradient id="stator" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </radialGradient>
    <radialGradient id="screw" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#7C8896"/>
    </radialGradient>
  </defs>

  <!-- drive housing -->
  <rect x="3" y="2" width="194" height="180.615" rx="16" fill="url(#panel)" stroke="#0F172A" stroke-width="1.2"/>
  <rect x="8" y="7" width="184" height="170.615" rx="12" fill="none" stroke="#64748B" stroke-width="0.8"/>
  <g fill="url(#screw)" stroke="#1E293B" stroke-width="0.8">
    <circle cx="21" cy="20" r="4"/>
    <circle cx="179" cy="20" r="4"/>
    <circle cx="21" cy="164.6" r="4"/>
    <circle cx="179" cy="164.6" r="4"/>
  </g>
  <g stroke="#475569" stroke-width="0.9" stroke-linecap="round">
    <line x1="18.5" y1="20" x2="23.5" y2="20"/>
    <line x1="176.5" y1="20" x2="181.5" y2="20"/>
    <line x1="18.5" y1="164.6" x2="23.5" y2="164.6"/>
    <line x1="176.5" y1="164.6" x2="181.5" y2="164.6"/>
  </g>
  <circle cx="179" cy="92.3" r="2" fill="#22C55E"/>

  <!-- valve head -->
  <circle cx="100" cy="92.308" r="68" fill="url(#bezel)" stroke="#0F172A" stroke-width="1.2"/>
  <circle cx="100" cy="92.308" r="61" fill="url(#stator)" stroke="#94A3B8" stroke-width="0.8"/>
  <circle cx="100" cy="92.308" r="39" fill="#EEF2F6" stroke="#94A3B8" stroke-width="0.8"/>
  <circle cx="100" cy="92.308" r="36" fill="none" stroke="#CBD5E1" stroke-width="0.6" stroke-dasharray="2 2"/>
  <polygon points="96,26.6 104,26.6 100,31.6" fill="#2F6FB2"/>
</svg>
