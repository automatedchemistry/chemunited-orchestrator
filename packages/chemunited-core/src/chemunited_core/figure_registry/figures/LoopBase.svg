<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: LoopBase (mounting rail for a tubing loop).
     Units: scene px at 100 % zoom. The coil is drawn in code above the rail;
     its ends (= ports) are clamped at (0, 8.46) and (100, 8.46). -->
<svg xmlns="http://www.w3.org/2000/svg" width="2.16666in" height="0.583331in" viewBox="0 0 100 26.923">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- posts -->
  <g fill="#94A3B8" stroke="#334155" stroke-width="0.8">
    <rect x="4" y="12" width="5" height="6"/>
    <rect x="91" y="12" width="5" height="6"/>
  </g>

  <!-- rail -->
  <rect x="1" y="16.5" width="98" height="9.6" rx="3" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>
  <rect x="34" y="19.3" width="32" height="4" rx="1.2" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.5"/>
  <g fill="#94A3B8" stroke="#64748B" stroke-width="0.4">
    <circle cx="20" cy="21.3" r="1.1"/>
    <circle cx="80" cy="21.3" r="1.1"/>
  </g>

  <!-- tube clamps -->
  <g fill="url(#metal)" stroke="#334155" stroke-width="1">
    <rect x="1" y="3.5" width="11" height="10" rx="1.5"/>
    <rect x="88" y="3.5" width="11" height="10" rx="1.5"/>
  </g>
  <g stroke="#64748B" stroke-width="0.6">
    <line x1="6.5" y1="4" x2="6.5" y2="13"/>
    <line x1="93.5" y1="4" x2="93.5" y2="13"/>
  </g>
</svg>
