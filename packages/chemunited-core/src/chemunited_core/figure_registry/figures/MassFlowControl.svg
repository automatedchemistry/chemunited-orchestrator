<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: MassFlowControl (thermal mass-flow controller).
     Units: scene px at 100 % zoom. Ports at (0.95, 85) and (90.95, 85);
     a 50 px status tint is drawn in code over the centre (46, 50). -->
<svg xmlns="http://www.w3.org/2000/svg" width="3.54166in" height="3.85417in" viewBox="0 0 91.892 100">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- flow body + fittings -->
  <rect x="6" y="76" width="79.9" height="18" rx="2.5" fill="url(#metal)" stroke="#334155" stroke-width="1.2"/>
  <g fill="url(#metal)" stroke="#334155" stroke-width="1">
    <rect x="0.6" y="79.5" width="8.6" height="11" rx="1"/>
    <rect x="82.7" y="79.5" width="8.6" height="11" rx="1"/>
  </g>
  <g stroke="#64748B" stroke-width="0.6">
    <line x1="3.5" y1="80" x2="3.5" y2="90"/>
    <line x1="6.3" y1="80" x2="6.3" y2="90"/>
    <line x1="85.6" y1="80" x2="85.6" y2="90"/>
    <line x1="88.4" y1="80" x2="88.4" y2="90"/>
  </g>

  <!-- connector -->
  <rect x="35" y="1" width="22" height="6.5" rx="1" fill="#94A3B8" stroke="#334155" stroke-width="0.8"/>
  <g fill="#475569">
    <circle cx="40" cy="4.2" r="0.8"/>
    <circle cx="44" cy="4.2" r="0.8"/>
    <circle cx="48" cy="4.2" r="0.8"/>
    <circle cx="52" cy="4.2" r="0.8"/>
  </g>

  <!-- electronics housing -->
  <rect x="11" y="6.5" width="69.9" height="70" rx="4" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>
  <rect x="17" y="13" width="57.9" height="21" rx="2" fill="#0F172A" stroke="#334155" stroke-width="0.6"/>
  <g stroke="#5EEAD4" stroke-linecap="round">
    <line x1="22" y1="20.5" x2="48" y2="20.5" stroke-width="3"/>
    <line x1="22" y1="28" x2="38" y2="28" stroke-width="1.4" stroke-opacity="0.7"/>
    <line x1="58" y1="28" x2="69" y2="28" stroke-width="1.4" stroke-opacity="0.7"/>
  </g>
  <rect x="11.6" y="39" width="68.7" height="3.4" fill="#2F6FB2"/>
  <g fill="#64748B" stroke="#64748B" stroke-width="1.6" stroke-linecap="round">
    <line x1="27" y1="58" x2="61" y2="58"/>
    <polygon points="67,58 60,54.3 60,61.7" stroke-width="0.6" stroke-linejoin="round"/>
  </g>
  <circle cx="73" cy="70" r="1.6" fill="#22C55E"/>
</svg>
