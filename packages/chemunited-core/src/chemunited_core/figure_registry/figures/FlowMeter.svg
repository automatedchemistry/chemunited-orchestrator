<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: FlowMeter (inline liquid flow sensor with display).
     Units: scene px at 100 % zoom. Front fittings / ports at (25, 36.2)
     and (75, 36.2). -->
<svg xmlns="http://www.w3.org/2000/svg" width="3.95833in" height="2.86458in" viewBox="0 0 100 72.368">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="nut" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </radialGradient>
  </defs>

  <rect x="3" y="3" width="94" height="66" rx="6" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>

  <!-- display -->
  <rect x="10" y="8.5" width="80" height="17.5" rx="2" fill="#0F172A" stroke="#334155" stroke-width="0.6"/>
  <g stroke="#5EEAD4" stroke-linecap="round" fill="none">
    <line x1="15" y1="14.5" x2="42" y2="14.5" stroke-width="3"/>
    <line x1="15" y1="21" x2="33" y2="21" stroke-width="1.4" stroke-opacity="0.7"/>
    <polyline points="54,21 60,17 65,19 71,13 77,15.5 85,12" stroke-width="1.1" stroke-linejoin="round"/>
  </g>

  <!-- flow channel -->
  <rect x="14" y="31.2" width="72" height="10" rx="5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.7"/>
  <line x1="25" y1="36.2" x2="75" y2="36.2" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <g fill="#2F6FB2" stroke="#2F6FB2" stroke-width="1.4" stroke-linecap="round">
    <line x1="40" y1="36.2" x2="54" y2="36.2"/>
    <polygon points="60,36.2 53,32.6 53,39.8" stroke-width="0.6" stroke-linejoin="round"/>
  </g>
  <g fill="url(#nut)" stroke="#334155" stroke-width="1">
    <circle cx="25" cy="36.2" r="4.6"/>
    <circle cx="75" cy="36.2" r="4.6"/>
  </g>
  <g fill="#475569">
    <circle cx="25" cy="36.2" r="1.8"/>
    <circle cx="75" cy="36.2" r="1.8"/>
  </g>

  <!-- controls -->
  <g fill="url(#slate)" stroke="#475569" stroke-width="0.6">
    <circle cx="18" cy="54" r="2.8"/>
    <circle cx="27" cy="54" r="2.8"/>
    <circle cx="36" cy="54" r="2.8"/>
  </g>
  <circle cx="83" cy="54" r="1.7" fill="#22C55E"/>
  <rect x="9" y="61.5" width="82" height="2.6" rx="1.3" fill="#2F6FB2"/>
</svg>
