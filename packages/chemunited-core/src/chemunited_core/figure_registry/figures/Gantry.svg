<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: Gantry (Gantry1D: single-axis head over one vial row).
     Units: scene px at 100 % zoom (200 px wide). Head fitting / port at
     (100, 15.5). The top-left corner (x < 34, y < 25) is left empty for the
     "1D" label drawn in code. Gantry3D has its own figure (Gantry3D.svg). -->
<svg xmlns="http://www.w3.org/2000/svg" width="5.35433in" height="3.64173in" viewBox="0 0 200 136.029">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94A3B8"/>
      <stop offset="0.45" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="carriage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B9BE0"/>
      <stop offset="1" stop-color="#1F4F91"/>
    </linearGradient>
    <radialGradient id="nut" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </radialGradient>
  </defs>

  <!-- deck -->
  <rect x="4" y="120" width="192" height="14" rx="3" fill="url(#slate)" stroke="#334155" stroke-width="1.2"/>

  <!-- columns + beam -->
  <g fill="url(#metalV)" stroke="#334155" stroke-width="1.2">
    <rect x="7" y="34" width="10" height="87"/>
    <rect x="183" y="34" width="10" height="87"/>
  </g>
  <rect x="4" y="26" width="192" height="12" rx="2" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>
  <line x1="20" y1="32" x2="180" y2="32" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>

  <!-- vial rack -->
  <rect x="18" y="106" width="164" height="14.5" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
  <g fill="#FFFFFF" fill-opacity="0.45" stroke="#64748B" stroke-width="0.7">
    <rect x="24" y="96" width="8" height="18" rx="1.5"/>
    <rect x="36" y="96" width="8" height="18" rx="1.5"/>
    <rect x="48" y="96" width="8" height="18" rx="1.5"/>
    <rect x="60" y="96" width="8" height="18" rx="1.5"/>
    <rect x="72" y="96" width="8" height="18" rx="1.5"/>
    <rect x="84" y="96" width="8" height="18" rx="1.5"/>
    <rect x="96" y="96" width="8" height="18" rx="1.5"/>
    <rect x="108" y="96" width="8" height="18" rx="1.5"/>
    <rect x="120" y="96" width="8" height="18" rx="1.5"/>
    <rect x="132" y="96" width="8" height="18" rx="1.5"/>
    <rect x="144" y="96" width="8" height="18" rx="1.5"/>
    <rect x="156" y="96" width="8" height="18" rx="1.5"/>
    <rect x="168" y="96" width="8" height="18" rx="1.5"/>
  </g>
  <g fill-opacity="0.9">
    <rect x="24.8" y="104" width="6.4" height="9.2" rx="1" fill="#F59E0B"/>
    <rect x="36.8" y="106" width="6.4" height="7.2" rx="1" fill="#EF4444"/>
    <rect x="48.8" y="103" width="6.4" height="10.2" rx="1" fill="#22C55E"/>
    <rect x="60.8" y="105" width="6.4" height="8.2" rx="1" fill="#3B82F6"/>
    <rect x="72.8" y="102" width="6.4" height="11.2" rx="1" fill="#A855F7"/>
    <rect x="84.8" y="106" width="6.4" height="7.2" rx="1" fill="#14B8A6"/>
    <rect x="96.8" y="104" width="6.4" height="9.2" rx="1" fill="#F59E0B"/>
    <rect x="108.8" y="103" width="6.4" height="10.2" rx="1" fill="#EF4444"/>
    <rect x="120.8" y="105" width="6.4" height="8.2" rx="1" fill="#22C55E"/>
    <rect x="132.8" y="102" width="6.4" height="11.2" rx="1" fill="#3B82F6"/>
    <rect x="144.8" y="106" width="6.4" height="7.2" rx="1" fill="#A855F7"/>
    <rect x="156.8" y="104" width="6.4" height="9.2" rx="1" fill="#14B8A6"/>
    <rect x="168.8" y="103" width="6.4" height="10.2" rx="1" fill="#F59E0B"/>
  </g>
  <g fill="#475569">
    <rect x="23.5" y="93.5" width="9" height="3" rx="0.6"/>
    <rect x="35.5" y="93.5" width="9" height="3" rx="0.6"/>
    <rect x="47.5" y="93.5" width="9" height="3" rx="0.6"/>
    <rect x="59.5" y="93.5" width="9" height="3" rx="0.6"/>
    <rect x="71.5" y="93.5" width="9" height="3" rx="0.6"/>
    <rect x="83.5" y="93.5" width="9" height="3" rx="0.6"/>
    <rect x="95.5" y="93.5" width="9" height="3" rx="0.6"/>
    <rect x="107.5" y="93.5" width="9" height="3" rx="0.6"/>
    <rect x="119.5" y="93.5" width="9" height="3" rx="0.6"/>
    <rect x="131.5" y="93.5" width="9" height="3" rx="0.6"/>
    <rect x="143.5" y="93.5" width="9" height="3" rx="0.6"/>
    <rect x="155.5" y="93.5" width="9" height="3" rx="0.6"/>
    <rect x="167.5" y="93.5" width="9" height="3" rx="0.6"/>
  </g>

  <!-- dispensing tip (fixed height: the head only travels along X) -->
  <path d="M97 49 H103 L101.2 58 H98.8 Z" fill="url(#metalV)" stroke="#334155" stroke-width="0.7" stroke-linejoin="round"/>
  <line x1="100" y1="61" x2="100" y2="90" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2.5 2.5"/>

  <!-- carriage -->
  <rect x="86" y="7" width="28" height="43" rx="3" fill="url(#carriage)" stroke="#1E3A5F" stroke-width="1.2"/>
  <line x1="89" y1="9" x2="111" y2="9" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.8" stroke-linecap="round"/>
  <g fill="#1E3A5F">
    <circle cx="91" cy="44.5" r="1.6"/>
    <circle cx="109" cy="44.5" r="1.6"/>
  </g>
  <circle cx="100" cy="15.5" r="4.2" fill="url(#nut)" stroke="#334155" stroke-width="0.9"/>

  <!-- X travel arrows on the rail -->
  <g fill="#EF4444">
    <polygon points="75,32 82,28 82,36"/>
    <polygon points="125,32 118,28 118,36"/>
  </g>

  <!-- axis marker: X only -->
  <circle cx="168" cy="13" r="1.5" fill="#334155"/>
  <line x1="168" y1="13" x2="184" y2="13" stroke="#EF4444" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="189,13 183.5,10.3 183.5,15.7" fill="#EF4444"/>
  <text x="191.5" y="17" font-family="Arial" font-size="7" font-weight="bold" fill="#EF4444">x</text>
</svg>
