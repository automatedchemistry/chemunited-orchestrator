<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: LengthControl (linear travel / length setpoint badge).
     Units: scene px at 100 % zoom. -->
<svg xmlns="http://www.w3.org/2000/svg" width="35.9833mm" height="35.9833mm" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#94A3B8" stroke-width="0.8"/>

  <!-- scale -->
  <g stroke="#64748B" stroke-width="1.2" stroke-linecap="round">
    <line x1="22" y1="24" x2="31" y2="24"/>
    <line x1="26" y1="31" x2="31" y2="31"/>
    <line x1="22" y1="38" x2="31" y2="38"/>
    <line x1="26" y1="45" x2="31" y2="45"/>
    <line x1="22" y1="52" x2="31" y2="52"/>
    <line x1="26" y1="59" x2="31" y2="59"/>
    <line x1="22" y1="66" x2="31" y2="66"/>
    <line x1="26" y1="73" x2="31" y2="73"/>
  </g>

  <!-- travel arrow -->
  <rect x="36" y="74" width="28" height="7" rx="2" fill="url(#panel)" stroke="#1E293B" stroke-width="1"/>
  <path d="M50 15 L67 35 H56 V74 H44 V35 H33 Z" fill="#2F6FB2" stroke="#1E3A5F" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="48" y1="38" x2="48" y2="70" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
</svg>
