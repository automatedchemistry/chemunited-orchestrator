<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: NMRControl (benchtop NMR with flow cell).
     Units: scene px at 100 % zoom. Flow-cell fittings / ports at
     (11.65, 40) and (67.65, 40). -->
<svg xmlns="http://www.w3.org/2000/svg" width="2.39583in" height="3.02083in" viewBox="0 0 79.31 100">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94A3B8"/>
      <stop offset="0.45" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="nut" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </radialGradient>
  </defs>

  <g fill="#475569">
    <rect x="8" y="93.5" width="12" height="5" rx="1"/>
    <rect x="59.31" y="93.5" width="12" height="5" rx="1"/>
  </g>

  <!-- sample inlet -->
  <rect x="33.65" y="1.5" width="12" height="11" rx="2" fill="url(#metal)" stroke="#334155" stroke-width="1"/>
  <rect x="37.4" y="1.5" width="4.5" height="3.5" fill="#334155"/>

  <rect x="2" y="10" width="75.31" height="85" rx="7" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>
  <rect x="2.6" y="25" width="74.11" height="3" fill="#2F6FB2"/>
  <rect x="21" y="14.5" width="37.31" height="7" rx="1.5" fill="#0F172A" stroke="#334155" stroke-width="0.6"/>
  <line x1="24" y1="18" x2="40" y2="18" stroke="#5EEAD4" stroke-width="1.6" stroke-linecap="round"/>

  <!-- flow path to the magnet centre -->
  <path d="M15.8 40 H24 Q30 40 33 46 M63.5 40 H55.3 Q49.3 40 46.3 46" fill="none" stroke="#64748B" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="39.65" y1="12" x2="39.65" y2="42" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- magnet emblem -->
  <circle cx="39.65" cy="60" r="18" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.8"/>
  <path d="M25.65 60 A14 14 0 0 1 53.65 60 Z" fill="#EF4444" stroke="#991B1B" stroke-width="0.6"/>
  <path d="M25.65 60 A14 14 0 0 0 53.65 60 Z" fill="#3B82F6" stroke="#1E40AF" stroke-width="0.6"/>
  <text x="39.65" y="56.5" font-family="Arial" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N</text>
  <text x="39.65" y="70.5" font-family="Arial" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">S</text>

  <g fill="url(#nut)" stroke="#334155" stroke-width="0.9">
    <circle cx="11.65" cy="40" r="4.2"/>
    <circle cx="67.65" cy="40" r="4.2"/>
  </g>
  <circle cx="68" cy="86" r="1.6" fill="#22C55E"/>
</svg>
