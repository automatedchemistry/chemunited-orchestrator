<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: SourceSink (open boundary: infinite source / drain).
     Units: scene px at 100 % zoom. The connection boss is on the left
     (port at (5, 25)); Source uses the same figure rotated 180 deg. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1.09375in" height="1.09375in" viewBox="0 0 50 50">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <radialGradient id="well" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#475569"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <circle cx="25" cy="25" r="22.5" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>
  <circle cx="25" cy="25" r="14.5" fill="url(#well)" stroke="#334155" stroke-width="0.8"/>
  <circle cx="25" cy="25" r="9.5" fill="none" stroke="#94A3B8" stroke-opacity="0.55" stroke-width="0.8"/>
  <circle cx="25" cy="25" r="4.5" fill="none" stroke="#94A3B8" stroke-opacity="0.4" stroke-width="0.8"/>
  <rect x="1" y="20.5" width="9" height="9" rx="1.8" fill="url(#metal)" stroke="#334155" stroke-width="1"/>
</svg>
