<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: SyringePlunger (stopper, rod and pusher block).
     Units: scene px at 100 % zoom. Slides right inside the barrel as the
     syringe fills; the left edge is the rubber stopper face. -->
<svg xmlns="http://www.w3.org/2000/svg" width="3.17708in" height="0.624992in" viewBox="0 0 60 11.803">
  <defs>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#A3B0BE"/>
    </linearGradient>
    <linearGradient id="pusher" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect x="4.4" y="4.4" width="51" height="3" fill="url(#rod)" stroke="#64748B" stroke-width="0.5"/>
  <rect x="0.4" y="0.6" width="4.4" height="10.6" rx="1" fill="#334155" stroke="#1E293B" stroke-width="0.5"/>
  <g stroke="#64748B" stroke-width="0.5">
    <line x1="1.9" y1="1" x2="1.9" y2="10.8"/>
    <line x1="3.3" y1="1" x2="3.3" y2="10.8"/>
  </g>
  <rect x="54.4" y="0.4" width="5.2" height="11" rx="1" fill="url(#pusher)" stroke="#1E293B" stroke-width="0.6"/>
</svg>
