<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: Separator (membrane liquid-liquid separator).
     Units: scene px at 100 % zoom. Ports at (10, 14.9) and (10, 43.9). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1.19791in" height="0.979165in" viewBox="0 0 100 81.74">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="dial" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A3B0BE"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- regulator dial (right) -->
  <rect x="73" y="34" width="8" height="15" fill="url(#metal)" stroke="#334155" stroke-width="0.9"/>
  <circle cx="87" cy="41.5" r="11.5" fill="url(#dial)" stroke="#334155" stroke-width="1.2"/>
  <circle cx="87" cy="41.5" r="6.5" fill="url(#panel)" stroke="#1E293B" stroke-width="0.6"/>
  <line x1="87" y1="36.5" x2="87" y2="40" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/>

  <!-- body -->
  <rect x="14" y="2.5" width="61" height="76.5" rx="5" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>
  <rect x="21" y="9" width="47" height="27" rx="3" fill="#FCD34D" fill-opacity="0.5" stroke="#64748B" stroke-width="0.7"/>
  <rect x="21" y="45" width="47" height="27.5" rx="3" fill="#7DD3FC" fill-opacity="0.55" stroke="#64748B" stroke-width="0.7"/>
  <line x1="19" y1="40.5" x2="70" y2="40.5" stroke="#2F6FB2" stroke-width="1.6" stroke-dasharray="2.5 1.5"/>
  <g fill="#94A3B8" stroke="#64748B" stroke-width="0.4">
    <circle cx="17.8" cy="6.3" r="1.2"/>
    <circle cx="71.2" cy="6.3" r="1.2"/>
    <circle cx="17.8" cy="75.2" r="1.2"/>
    <circle cx="71.2" cy="75.2" r="1.2"/>
  </g>

  <!-- inlet fittings -->
  <g fill="url(#metal)" stroke="#334155" stroke-width="1">
    <rect x="4" y="9.9" width="11" height="10" rx="1"/>
    <rect x="4" y="38.9" width="11" height="10" rx="1"/>
  </g>
  <g stroke="#64748B" stroke-width="0.6">
    <line x1="4.5" y1="13.3" x2="14.5" y2="13.3"/>
    <line x1="4.5" y1="16.5" x2="14.5" y2="16.5"/>
    <line x1="4.5" y1="42.3" x2="14.5" y2="42.3"/>
    <line x1="4.5" y1="45.5" x2="14.5" y2="45.5"/>
  </g>
</svg>
