<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: IRControl (inline IR spectrometer with flow cell).
     Units: scene px at 100 % zoom. Flow-cell fittings / ports at
     (40, 43.3) and (60, 43.3). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1.66666in" height="1.51041in" viewBox="0 0 100 90.625">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <radialGradient id="bezel" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </radialGradient>
    <radialGradient id="cell" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9F1239"/>
      <stop offset="1" stop-color="#0F172A"/>
    </radialGradient>
    <radialGradient id="nut" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </radialGradient>
  </defs>

  <g fill="#475569">
    <rect x="9" y="84" width="12" height="5" rx="1"/>
    <rect x="79" y="84" width="12" height="5" rx="1"/>
  </g>
  <rect x="2" y="2" width="96" height="83" rx="6" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>
  <rect x="2.6" y="12" width="94.8" height="3" fill="#E11D48"/>
  <text x="8" y="9.6" font-family="Arial" font-size="6.5" font-weight="bold" fill="#334155">IR</text>

  <!-- flow cell -->
  <circle cx="50" cy="43.3" r="24" fill="url(#bezel)" stroke="#334155" stroke-width="1.2"/>
  <circle cx="50" cy="43.3" r="18.5" fill="url(#cell)" stroke="#1E293B" stroke-width="0.8"/>
  <line x1="40" y1="43.3" x2="60" y2="43.3" stroke="#FDA4AF" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round"/>
  <path d="M38 34 A15 15 0 0 1 47 29" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round"/>
  <g fill="url(#nut)" stroke="#334155" stroke-width="0.9">
    <circle cx="40" cy="43.3" r="4.2"/>
    <circle cx="60" cy="43.3" r="4.2"/>
  </g>

  <!-- status + vents -->
  <circle cx="88" cy="26" r="1.6" fill="#22C55E"/>
  <circle cx="88" cy="32" r="1.6" fill="#F59E0B"/>
  <circle cx="88" cy="38" r="1.6" fill="#CBD5E1"/>
  <g stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round">
    <line x1="24" y1="73" x2="76" y2="73"/>
    <line x1="24" y1="78" x2="76" y2="78"/>
  </g>
</svg>
