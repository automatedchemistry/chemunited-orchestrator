<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: Peltier (fan-cooled thermoelectric module + cold block).
     Units: scene px at 100 % zoom. Heat connection / port at (100, 42.4). -->
<svg xmlns="http://www.w3.org/2000/svg" width="9.58333in" height="8.12499in" viewBox="0 0 100 84.783">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4B5A6C"/>
      <stop offset="1" stop-color="#2B3746"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </radialGradient>
  </defs>

  <!-- fan unit -->
  <rect x="2" y="2" width="54" height="80.783" rx="4" fill="url(#panel)" stroke="#0F172A" stroke-width="1.2"/>
  <g fill="#94A3B8" stroke="#1E293B" stroke-width="0.5">
    <circle cx="7" cy="7" r="1.6"/>
    <circle cx="51" cy="7" r="1.6"/>
    <circle cx="7" cy="77.8" r="1.6"/>
    <circle cx="51" cy="77.8" r="1.6"/>
  </g>
  <g fill="#1E293B" stroke="#64748B" stroke-width="1">
    <circle cx="29" cy="22.5" r="17"/>
    <circle cx="29" cy="62.3" r="17"/>
  </g>
  <g fill="#94A3B8" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="0.4">
    <path transform="translate(29 22.5)" d="M0 -3.5 C4 -6 7 -11 5 -15 C0 -14.5 -3 -9.5 0 -3.5 Z"/>
    <path transform="translate(29 22.5) rotate(72)" d="M0 -3.5 C4 -6 7 -11 5 -15 C0 -14.5 -3 -9.5 0 -3.5 Z"/>
    <path transform="translate(29 22.5) rotate(144)" d="M0 -3.5 C4 -6 7 -11 5 -15 C0 -14.5 -3 -9.5 0 -3.5 Z"/>
    <path transform="translate(29 22.5) rotate(216)" d="M0 -3.5 C4 -6 7 -11 5 -15 C0 -14.5 -3 -9.5 0 -3.5 Z"/>
    <path transform="translate(29 22.5) rotate(288)" d="M0 -3.5 C4 -6 7 -11 5 -15 C0 -14.5 -3 -9.5 0 -3.5 Z"/>
    <path transform="translate(29 62.3)" d="M0 -3.5 C4 -6 7 -11 5 -15 C0 -14.5 -3 -9.5 0 -3.5 Z"/>
    <path transform="translate(29 62.3) rotate(72)" d="M0 -3.5 C4 -6 7 -11 5 -15 C0 -14.5 -3 -9.5 0 -3.5 Z"/>
    <path transform="translate(29 62.3) rotate(144)" d="M0 -3.5 C4 -6 7 -11 5 -15 C0 -14.5 -3 -9.5 0 -3.5 Z"/>
    <path transform="translate(29 62.3) rotate(216)" d="M0 -3.5 C4 -6 7 -11 5 -15 C0 -14.5 -3 -9.5 0 -3.5 Z"/>
    <path transform="translate(29 62.3) rotate(288)" d="M0 -3.5 C4 -6 7 -11 5 -15 C0 -14.5 -3 -9.5 0 -3.5 Z"/>
  </g>
  <g fill="url(#hub)" stroke="#334155" stroke-width="0.6">
    <circle cx="29" cy="22.5" r="4.2"/>
    <circle cx="29" cy="62.3" r="4.2"/>
  </g>

  <!-- heat sink -->
  <rect x="56" y="8" width="11" height="68.8" fill="#CBD5E1" stroke="#334155" stroke-width="1"/>
  <g stroke="#94A3B8" stroke-width="1.3">
    <line x1="56.5" y1="13" x2="66.5" y2="13"/>
    <line x1="56.5" y1="18" x2="66.5" y2="18"/>
    <line x1="56.5" y1="23" x2="66.5" y2="23"/>
    <line x1="56.5" y1="28" x2="66.5" y2="28"/>
    <line x1="56.5" y1="33" x2="66.5" y2="33"/>
    <line x1="56.5" y1="38" x2="66.5" y2="38"/>
    <line x1="56.5" y1="43" x2="66.5" y2="43"/>
    <line x1="56.5" y1="48" x2="66.5" y2="48"/>
    <line x1="56.5" y1="53" x2="66.5" y2="53"/>
    <line x1="56.5" y1="58" x2="66.5" y2="58"/>
    <line x1="56.5" y1="63" x2="66.5" y2="63"/>
    <line x1="56.5" y1="68" x2="66.5" y2="68"/>
    <line x1="56.5" y1="73" x2="66.5" y2="73"/>
  </g>

  <!-- thermoelectric sandwich: hot face / pellets / cold face -->
  <rect x="67" y="18" width="4" height="48.8" fill="#FCA5A5" stroke="#334155" stroke-width="0.8"/>
  <rect x="71" y="18" width="3" height="48.8" fill="#475569"/>
  <rect x="74" y="18" width="4" height="48.8" fill="#BAE6FD" stroke="#334155" stroke-width="0.8"/>

  <!-- cold block + connector -->
  <rect x="78" y="22" width="17" height="40.8" rx="2" fill="url(#metal)" stroke="#334155" stroke-width="1.2"/>
  <g stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round">
    <line x1="82" y1="30" x2="91" y2="30"/>
    <line x1="82" y1="54.8" x2="91" y2="54.8"/>
  </g>
  <rect x="94.5" y="37.4" width="5" height="10" rx="1" fill="url(#metal)" stroke="#334155" stroke-width="0.9"/>
</svg>
