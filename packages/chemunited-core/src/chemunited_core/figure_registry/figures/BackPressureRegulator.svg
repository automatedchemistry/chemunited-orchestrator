<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: BackPressureRegulator (spring/dome BPR on a flow body).
     Units: scene px at 100 % zoom. Ports at (0, 63.7) and (100, 63.7). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1.89583in" height="1.35417in" viewBox="0 0 100 71.429">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A3B0BE"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- flow body + fittings -->
  <rect x="8" y="55.5" width="84" height="15" rx="2.5" fill="url(#metal)" stroke="#334155" stroke-width="1.2"/>
  <g fill="url(#metal)" stroke="#334155" stroke-width="1">
    <rect x="0.8" y="58.4" width="9" height="10.6" rx="1"/>
    <rect x="90.2" y="58.4" width="9" height="10.6" rx="1"/>
  </g>
  <g stroke="#64748B" stroke-width="0.6">
    <line x1="3.8" y1="59" x2="3.8" y2="68.4"/>
    <line x1="6.8" y1="59" x2="6.8" y2="68.4"/>
    <line x1="93.2" y1="59" x2="93.2" y2="68.4"/>
    <line x1="96.2" y1="59" x2="96.2" y2="68.4"/>
  </g>
  <g fill="#64748B" stroke="#64748B" stroke-width="1.4" stroke-linecap="round">
    <line x1="22" y1="63" x2="76" y2="63"/>
    <polygon points="80,63 74,60 74,66" stroke-width="0.6" stroke-linejoin="round"/>
  </g>

  <!-- bonnet -->
  <rect x="14" y="49" width="72" height="7" rx="1.5" fill="url(#metal)" stroke="#334155" stroke-width="1"/>
  <path d="M19 49.5 V29 Q19 13 35 13 H65 Q81 13 81 29 V49.5 Z" fill="url(#metalV)" stroke="#334155" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="19.6" y="40" width="60.8" height="4.5" fill="#F59E0B"/>
  <rect x="38" y="21" width="24" height="13" rx="1.5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.6"/>
  <text x="50" y="30" font-family="Arial" font-size="7" font-weight="bold" fill="#334155" text-anchor="middle">BPR</text>

  <!-- adjustment knob -->
  <rect x="46" y="10" width="8" height="5" fill="#94A3B8" stroke="#334155" stroke-width="0.8"/>
  <rect x="39" y="1.5" width="22" height="10" rx="3" fill="url(#panel)" stroke="#1E293B" stroke-width="1"/>
  <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1">
    <line x1="44" y1="3.5" x2="44" y2="9.5"/>
    <line x1="48" y1="3.5" x2="48" y2="9.5"/>
    <line x1="52" y1="3.5" x2="52" y2="9.5"/>
    <line x1="56" y1="3.5" x2="56" y2="9.5"/>
  </g>
</svg>
