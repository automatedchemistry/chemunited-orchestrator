<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: PressureControl (electronic pressure controller with
     control valve). Units: scene px at 100 % zoom. Port at (90, 69.4). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1.82291in" height="1.58333in" viewBox="0 0 100 86.857">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A3B0BE"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- flow body: blind plug left, outlet fitting right -->
  <rect x="2" y="64" width="6" height="10.8" rx="1" fill="url(#metal)" stroke="#334155" stroke-width="1"/>
  <rect x="6" y="61" width="80" height="17" rx="2.5" fill="url(#metal)" stroke="#334155" stroke-width="1.2"/>
  <rect x="84.8" y="64" width="10.4" height="10.8" rx="1" fill="url(#metal)" stroke="#334155" stroke-width="1"/>
  <line x1="88.2" y1="64.5" x2="88.2" y2="74.3" stroke="#64748B" stroke-width="0.6"/>
  <line x1="91.8" y1="64.5" x2="91.8" y2="74.3" stroke="#64748B" stroke-width="0.6"/>

  <!-- control valve -->
  <rect x="65" y="14" width="20" height="48" rx="3" fill="url(#metalV)" stroke="#334155" stroke-width="1.2"/>
  <rect x="65.6" y="37" width="18.8" height="3.2" fill="#F59E0B"/>
  <rect x="63" y="9" width="24" height="7" rx="2" fill="url(#panel)" stroke="#1E293B" stroke-width="1"/>

  <!-- electronics -->
  <rect x="6" y="3" width="56" height="58.5" rx="4" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>
  <rect x="12" y="9" width="44" height="18" rx="2" fill="#0F172A" stroke="#334155" stroke-width="0.6"/>
  <g stroke-linecap="round">
    <line x1="16" y1="15" x2="38" y2="15" stroke="#5EEAD4" stroke-width="3"/>
    <line x1="16" y1="22" x2="30" y2="22" stroke="#5EEAD4" stroke-width="1.4" stroke-opacity="0.7"/>
    <line x1="44" y1="22" x2="52" y2="22" stroke="#F59E0B" stroke-width="1.4"/>
  </g>
  <rect x="6.6" y="31" width="54.8" height="3.2" fill="#F59E0B"/>
  <circle cx="21" cy="46" r="7.5" fill="url(#slate)" stroke="#334155" stroke-width="1"/>
  <circle cx="21" cy="46" r="4.6" fill="url(#panel)"/>
  <line x1="21" y1="42.6" x2="21" y2="45" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/>
  <g fill="url(#slate)" stroke="#475569" stroke-width="0.6">
    <rect x="35" y="40" width="8" height="5.5" rx="1"/>
    <rect x="46" y="40" width="8" height="5.5" rx="1"/>
  </g>
  <circle cx="52" cy="53" r="1.6" fill="#22C55E"/>
</svg>
