<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: HPLCPump (dual-head piston pump).
     Units: scene px at 100 % zoom. Bottom fittings / ports at (64, 70.2)
     and (85, 70.2). -->
<svg xmlns="http://www.w3.org/2000/svg" width="2.23958in" height="1.66666in" viewBox="0 0 100 74.418">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="head" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A3B0BE"/>
    </radialGradient>
  </defs>

  <!-- feet -->
  <g fill="#475569">
    <rect x="7" y="63" width="10" height="4.5" rx="1"/>
    <rect x="38" y="63" width="10" height="4.5" rx="1"/>
  </g>

  <!-- housing -->
  <rect x="1" y="1" width="98" height="63" rx="4" fill="url(#housing)" stroke="#334155" stroke-width="1.2"/>
  <rect x="1.6" y="22" width="96.8" height="2.6" fill="#2F6FB2"/>

  <!-- display + keypad -->
  <rect x="6" y="6" width="40" height="12.5" rx="1.5" fill="#0F172A" stroke="#334155" stroke-width="0.6"/>
  <g stroke="#5EEAD4" stroke-linecap="round">
    <line x1="9.5" y1="10.5" x2="27" y2="10.5" stroke-width="2"/>
    <line x1="9.5" y1="15" x2="21" y2="15" stroke-width="1" stroke-opacity="0.7"/>
    <line x1="33" y1="15" x2="42" y2="15" stroke-width="1" stroke-opacity="0.7"/>
  </g>
  <g fill="url(#slate)" stroke="#475569" stroke-width="0.6">
    <rect x="53" y="6" width="7" height="5" rx="1"/>
    <rect x="62" y="6" width="7" height="5" rx="1"/>
    <rect x="71" y="6" width="7" height="5" rx="1"/>
    <rect x="80" y="6" width="7" height="5" rx="1"/>
    <rect x="53" y="13" width="7" height="5" rx="1"/>
    <rect x="62" y="13" width="7" height="5" rx="1"/>
    <rect x="71" y="13" width="7" height="5" rx="1"/>
    <rect x="80" y="13" width="7" height="5" rx="1"/>
  </g>
  <circle cx="93.5" cy="12" r="1.4" fill="#22C55E"/>

  <!-- pump-head panel -->
  <rect x="6" y="28" width="88" height="31" rx="2.5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.6"/>
  <g fill="none" stroke="#64748B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 63 V56 H22 V53.5"/>
    <path d="M22 33.5 V31 H44 V33.5"/>
    <path d="M54 43.5 H72.5"/>
    <path d="M83.5 43.5 H85 V63"/>
  </g>
  <g stroke="#334155" stroke-width="1">
    <circle cx="22" cy="43.5" r="10" fill="url(#head)"/>
    <circle cx="44" cy="43.5" r="10" fill="url(#head)"/>
  </g>
  <g fill="#475569">
    <circle cx="22" cy="43.5" r="3.6"/>
    <circle cx="44" cy="43.5" r="3.6"/>
  </g>
  <g fill="#94A3B8" stroke="#475569" stroke-width="0.4">
    <circle cx="16" cy="37.5" r="1"/>
    <circle cx="28" cy="37.5" r="1"/>
    <circle cx="16" cy="49.5" r="1"/>
    <circle cx="28" cy="49.5" r="1"/>
    <circle cx="38" cy="37.5" r="1"/>
    <circle cx="50" cy="37.5" r="1"/>
    <circle cx="38" cy="49.5" r="1"/>
    <circle cx="50" cy="49.5" r="1"/>
  </g>
  <!-- purge valve -->
  <circle cx="78" cy="43.5" r="5.5" fill="url(#metal)" stroke="#334155" stroke-width="1"/>
  <circle cx="78" cy="43.5" r="3" fill="#334155"/>
  <line x1="78" y1="41" x2="78" y2="46" stroke="#CBD5E1" stroke-width="0.8" stroke-linecap="round"/>

  <!-- outlet fittings -->
  <g fill="url(#metal)" stroke="#334155" stroke-width="0.9">
    <rect x="60.5" y="62.5" width="7" height="7" rx="1"/>
    <rect x="81.5" y="62.5" width="7" height="7" rx="1"/>
  </g>
  <g stroke="#64748B" stroke-width="0.5">
    <line x1="62.8" y1="63" x2="62.8" y2="69"/>
    <line x1="65.2" y1="63" x2="65.2" y2="69"/>
    <line x1="83.8" y1="63" x2="83.8" y2="69"/>
    <line x1="86.2" y1="63" x2="86.2" y2="69"/>
  </g>
</svg>
