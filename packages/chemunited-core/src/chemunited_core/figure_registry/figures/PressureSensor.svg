<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: PressureSensor (dial gauge on an inline tee).
     Units: scene px at 100 % zoom. Ports at (2, 85) and (98, 85). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1.51041in" height="1.51041in" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94A3B8"/>
      <stop offset="0.45" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </radialGradient>
  </defs>

  <!-- inline tee + fittings -->
  <rect x="7" y="77" width="86" height="16" rx="2.5" fill="url(#metal)" stroke="#334155" stroke-width="1.2"/>
  <g fill="url(#metal)" stroke="#334155" stroke-width="1">
    <rect x="0.8" y="79.5" width="8.5" height="11" rx="1"/>
    <rect x="90.7" y="79.5" width="8.5" height="11" rx="1"/>
  </g>
  <g stroke="#64748B" stroke-width="0.6">
    <line x1="3.6" y1="80" x2="3.6" y2="90"/>
    <line x1="6.5" y1="80" x2="6.5" y2="90"/>
    <line x1="93.5" y1="80" x2="93.5" y2="90"/>
    <line x1="96.4" y1="80" x2="96.4" y2="90"/>
  </g>

  <!-- stem + hex nut -->
  <rect x="45" y="62" width="10" height="16" fill="url(#metalV)" stroke="#334155" stroke-width="1"/>
  <rect x="39.5" y="68" width="21" height="8" rx="1" fill="url(#metal)" stroke="#334155" stroke-width="1"/>
  <line x1="46.5" y1="68.5" x2="46.5" y2="75.5" stroke="#64748B" stroke-width="0.6"/>
  <line x1="53.5" y1="68.5" x2="53.5" y2="75.5" stroke="#64748B" stroke-width="0.6"/>

  <!-- dial -->
  <circle cx="50" cy="35" r="30" fill="url(#bezel)" stroke="#1E293B" stroke-width="1.2"/>
  <circle cx="50" cy="35" r="25.5" fill="url(#face)" stroke="#94A3B8" stroke-width="0.6"/>
  <g fill="none" stroke-width="3">
    <path d="M35.15 49.85 A21 21 0 0 1 60.5 16.81" stroke="#22C55E"/>
    <path d="M60.5 16.81 A21 21 0 0 1 71 35" stroke="#F59E0B"/>
    <path d="M71 35 A21 21 0 0 1 64.85 49.85" stroke="#EF4444"/>
  </g>
  <g stroke="#334155" stroke-width="1" stroke-linecap="round">
    <line x1="64" y1="35" x2="67.5" y2="35" transform="rotate(135 50 35)"/>
    <line x1="64" y1="35" x2="67.5" y2="35" transform="rotate(162 50 35)"/>
    <line x1="64" y1="35" x2="67.5" y2="35" transform="rotate(189 50 35)"/>
    <line x1="64" y1="35" x2="67.5" y2="35" transform="rotate(216 50 35)"/>
    <line x1="64" y1="35" x2="67.5" y2="35" transform="rotate(243 50 35)"/>
    <line x1="64" y1="35" x2="67.5" y2="35" transform="rotate(270 50 35)"/>
    <line x1="64" y1="35" x2="67.5" y2="35" transform="rotate(297 50 35)"/>
    <line x1="64" y1="35" x2="67.5" y2="35" transform="rotate(324 50 35)"/>
    <line x1="64" y1="35" x2="67.5" y2="35" transform="rotate(351 50 35)"/>
    <line x1="64" y1="35" x2="67.5" y2="35" transform="rotate(378 50 35)"/>
    <line x1="64" y1="35" x2="67.5" y2="35" transform="rotate(405 50 35)"/>
  </g>
  <text x="50" y="50" font-family="Arial" font-size="5" font-weight="bold" fill="#64748B" text-anchor="middle">bar</text>
  <polygon points="46,33.8 68,35 46,36.2" fill="#E11D48" transform="rotate(250 50 35)"/>
  <circle cx="50" cy="35" r="3.2" fill="url(#bezel)" stroke="#1E293B" stroke-width="0.6"/>
  <path d="M30 26 A22 22 0 0 1 44 14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/>
</svg>
