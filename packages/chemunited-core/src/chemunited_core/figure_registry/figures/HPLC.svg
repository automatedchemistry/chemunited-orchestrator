<?xml version="1.0" encoding="UTF-8"?>
<!-- ChemUnited figure: HPLC (modular stack: solvents, pump, autosampler,
     column oven, detector, base). Units: scene px at 100 % zoom (200 px tall).
     Fittings / ports at (2.3, 180) and (112.3, 180); the live chromatogram is
     drawn in code above the stack. -->
<svg xmlns="http://www.w3.org/2000/svg" width="2.49999in" height="4.37499in" viewBox="0 0 114.286 200">
  <defs>
    <linearGradient id="housing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#D5DDE6"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.4" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="head" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A3B0BE"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>

  <!-- solvent tray -->
  <g stroke="#64748B" stroke-width="0.8">
    <rect x="14" y="6" width="17" height="15" rx="2.5" fill="#FFFFFF" fill-opacity="0.4"/>
    <rect x="37" y="6" width="17" height="15" rx="2.5" fill="#FFFFFF" fill-opacity="0.4"/>
    <rect x="60" y="6" width="17" height="15" rx="2.5" fill="#FFFFFF" fill-opacity="0.4"/>
    <rect x="83" y="6" width="17" height="15" rx="2.5" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>
  <g fill-opacity="0.85">
    <rect x="14.8" y="11" width="15.4" height="9.2" rx="2" fill="#93C5FD"/>
    <rect x="37.8" y="12.5" width="15.4" height="7.7" rx="2" fill="#FDE68A"/>
    <rect x="60.8" y="10" width="15.4" height="10.2" rx="2" fill="#C4B5FD"/>
    <rect x="83.8" y="13.5" width="15.4" height="6.7" rx="2" fill="#A7F3D0"/>
  </g>
  <g fill="#2F6FB2" stroke="#1E3A5F" stroke-width="0.6">
    <rect x="17.5" y="2.5" width="10" height="4" rx="1"/>
    <rect x="40.5" y="2.5" width="10" height="4" rx="1"/>
    <rect x="63.5" y="2.5" width="10" height="4" rx="1"/>
    <rect x="86.5" y="2.5" width="10" height="4" rx="1"/>
  </g>
  <rect x="8" y="21" width="98.286" height="8" rx="2" fill="url(#slate)" stroke="#334155" stroke-width="1"/>

  <!-- module frames -->
  <g fill="url(#housing)" stroke="#334155" stroke-width="1.2">
    <rect x="8" y="31" width="98.286" height="32" rx="2.5"/>
    <rect x="8" y="65" width="98.286" height="47" rx="2.5"/>
    <rect x="8" y="114" width="98.286" height="28" rx="2.5"/>
    <rect x="8" y="144" width="98.286" height="24" rx="2.5"/>
  </g>
  <rect x="8" y="170" width="98.286" height="27" rx="2.5" fill="url(#slate)" stroke="#334155" stroke-width="1.2"/>
  <g fill="#334155">
    <rect x="11" y="34" width="6" height="26" rx="1.5"/>
    <rect x="11" y="68" width="6" height="41" rx="1.5"/>
    <rect x="11" y="117" width="6" height="22" rx="1.5"/>
    <rect x="11" y="147" width="6" height="18" rx="1.5"/>
  </g>
  <g fill="#22C55E">
    <circle cx="14" cy="38" r="1.4"/>
    <circle cx="14" cy="72" r="1.4"/>
    <circle cx="14" cy="121" r="1.4"/>
    <circle cx="14" cy="151" r="1.4"/>
  </g>

  <!-- pump module -->
  <g stroke="#334155" stroke-width="1">
    <circle cx="36" cy="47" r="8" fill="url(#head)"/>
    <circle cx="57" cy="47" r="8" fill="url(#head)"/>
  </g>
  <g fill="#475569">
    <circle cx="36" cy="47" r="3"/>
    <circle cx="57" cy="47" r="3"/>
  </g>
  <rect x="72" y="36" width="29" height="9" rx="1.5" fill="#0F172A" stroke="#334155" stroke-width="0.6"/>
  <line x1="75" y1="40.5" x2="90" y2="40.5" stroke="#5EEAD4" stroke-width="1.6" stroke-linecap="round"/>
  <g fill="url(#slate)" stroke="#475569" stroke-width="0.5">
    <rect x="72" y="49" width="8" height="5" rx="1"/>
    <rect x="82.5" y="49" width="8" height="5" rx="1"/>
    <rect x="93" y="49" width="8" height="5" rx="1"/>
  </g>

  <!-- autosampler window with vials -->
  <rect x="22" y="70" width="79" height="37" rx="2" fill="#0F172A" fill-opacity="0.88" stroke="#334155" stroke-width="0.8"/>
  <rect x="26" y="103" width="71" height="2" fill="#64748B"/>
  <g fill="#FFFFFF" fill-opacity="0.35" stroke="#94A3B8" stroke-width="0.5">
    <rect x="29" y="79" width="6" height="9" rx="1"/>
    <rect x="40" y="79" width="6" height="9" rx="1"/>
    <rect x="51" y="79" width="6" height="9" rx="1"/>
    <rect x="62" y="79" width="6" height="9" rx="1"/>
    <rect x="73" y="79" width="6" height="9" rx="1"/>
    <rect x="84" y="79" width="6" height="9" rx="1"/>
    <rect x="29" y="93" width="6" height="9" rx="1"/>
    <rect x="40" y="93" width="6" height="9" rx="1"/>
    <rect x="51" y="93" width="6" height="9" rx="1"/>
    <rect x="62" y="93" width="6" height="9" rx="1"/>
    <rect x="73" y="93" width="6" height="9" rx="1"/>
    <rect x="84" y="93" width="6" height="9" rx="1"/>
  </g>
  <g fill="#5B9BE0">
    <rect x="28.5" y="76.5" width="7" height="2.8" rx="0.6"/>
    <rect x="39.5" y="76.5" width="7" height="2.8" rx="0.6"/>
    <rect x="50.5" y="76.5" width="7" height="2.8" rx="0.6"/>
    <rect x="61.5" y="76.5" width="7" height="2.8" rx="0.6"/>
    <rect x="72.5" y="76.5" width="7" height="2.8" rx="0.6"/>
    <rect x="83.5" y="76.5" width="7" height="2.8" rx="0.6"/>
    <rect x="28.5" y="90.5" width="7" height="2.8" rx="0.6"/>
    <rect x="39.5" y="90.5" width="7" height="2.8" rx="0.6"/>
    <rect x="50.5" y="90.5" width="7" height="2.8" rx="0.6"/>
    <rect x="61.5" y="90.5" width="7" height="2.8" rx="0.6"/>
    <rect x="72.5" y="90.5" width="7" height="2.8" rx="0.6"/>
    <rect x="83.5" y="90.5" width="7" height="2.8" rx="0.6"/>
  </g>

  <!-- column oven -->
  <rect x="22" y="118" width="79" height="20" rx="2" fill="#0F172A" fill-opacity="0.88" stroke="#334155" stroke-width="0.8"/>
  <rect x="31" y="125.5" width="61" height="5" rx="2.5" fill="url(#metal)" stroke="#94A3B8" stroke-width="0.5"/>
  <g fill="#94A3B8">
    <rect x="28" y="124.5" width="4" height="7" rx="0.8"/>
    <rect x="91" y="124.5" width="4" height="7" rx="0.8"/>
  </g>

  <!-- detector -->
  <circle cx="34" cy="156" r="5.5" fill="url(#lamp)" stroke="#92400E" stroke-width="0.6"/>
  <rect x="45" y="151" width="56" height="10" rx="1.5" fill="#0F172A" stroke="#334155" stroke-width="0.6"/>
  <polyline points="48,158 60,158 64,153.5 67,158 78,158 81,155.5 84,158 98,158" fill="none" stroke="#5EEAD4" stroke-width="1" stroke-linejoin="round"/>

  <!-- base: vents + fittings -->
  <g stroke="#64748B" stroke-width="1.4" stroke-linecap="round">
    <line x1="30" y1="176" x2="84" y2="176"/>
    <line x1="30" y1="181" x2="84" y2="181"/>
    <line x1="30" y1="186" x2="84" y2="186"/>
    <line x1="30" y1="191" x2="84" y2="191"/>
  </g>
  <g fill="url(#metal)" stroke="#334155" stroke-width="1">
    <rect x="0.6" y="175" width="9" height="10" rx="1"/>
    <rect x="104.686" y="175" width="9" height="10" rx="1"/>
  </g>
  <g stroke="#64748B" stroke-width="0.6">
    <line x1="1" y1="178.3" x2="9.2" y2="178.3"/>
    <line x1="1" y1="181.7" x2="9.2" y2="181.7"/>
    <line x1="105.1" y1="178.3" x2="113.3" y2="178.3"/>
    <line x1="105.1" y1="181.7" x2="113.3" y2="181.7"/>
