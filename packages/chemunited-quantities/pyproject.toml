[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chemunited-quantities"
version = "0.0.4"
description = "Lab-aware physical quantity primitive for the chemunited ecosystem (wraps pint with chemistry-domain unit registry)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Samuel Vitor Saraiva", email = "samuel.saraiva@mpikg.mpg.de" },
]
requires-python = ">=3.11"
keywords = ["chemistry", "units", "pint", "laboratory", "automation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "pint>=0.23",
    "pydantic-pint>=0.3",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "mypy>=1.19.1",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chemunited_quantities"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/chemunited_quantities"]
